[workspace]
resolver = "2"
members = [
    "crates/db-core",
    "crates/events",
    "services/user-service",
    "services/messenger-service",
    "e2e",
]

[workspace.package]

[workspace.dependencies]
warp = "0.3.7"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
rand = "0.8"
uuid = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
